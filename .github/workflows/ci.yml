name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          for f in src/*.sh *.sh; do
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck --severity=warning src/*.sh *.sh

  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run installer (downloads uv if missing)
        run: bash install.sh

      - name: Installer works from any cwd
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/install.sh"
          test -f ~/.ikshvaku/ikshvaku.sh && echo "install from any cwd: OK"

      - name: Smoke test (bash)
        run: |
          source ~/.ikshvaku/ikshvaku.sh
          ikshvaku list
          ikshvaku create cienv
          ikshvaku install cienv idna
          ikshvaku activate cienv
          echo "VIRTUAL_ENV=$VIRTUAL_ENV"
          [ -n "$VIRTUAL_ENV" ] || { echo "❌ activation failed"; exit 1; }
          pip install packaging
          python -c "import packaging"
          python -m pip --version
          ikshvaku install six
          python -c "import six"
          deactivate
          ikshvaku remove cienv
          ikshvaku list

      - name: Project linking (init / status / bare activate / doctor)
        run: |
          source ~/.ikshvaku/ikshvaku.sh
          ikshvaku --version
          mkdir -p "$RUNNER_TEMP/myproj/sub"
          cd "$RUNNER_TEMP/myproj"
          ikshvaku init
          [ "$VIRTUAL_ENV" = "$HOME/.Python-Env/myproj" ] || { echo "❌ init did not activate"; exit 1; }
          ikshvaku status | grep "Active env:" > /dev/null || { echo "❌ status failed"; exit 1; }
          ikshvaku deactivate
          cd "$RUNNER_TEMP/myproj/sub"
          ikshvaku activate
          [ "$IKSHVAKU_ACTIVE" = "myproj" ] || { echo "❌ bare activate walk-up failed"; exit 1; }
          ikshvaku doctor > /dev/null || { echo "❌ doctor failed"; exit 1; }
          ikshvaku unlink > /dev/null

      - name: Tier 2 (config / run / export / clone / list --size / cleanup)
        run: |
          source ~/.ikshvaku/ikshvaku.sh
          cd "$RUNNER_TEMP/myproj"
          ikshvaku link myproj > /dev/null
          ikshvaku config python_default 3.12
          [ "$(ikshvaku config python_default)" = "python_default=3.12" ] || { echo "❌ config"; exit 1; }
          ikshvaku create cfgtest > /dev/null 2>&1
          ikshvaku install cfgtest idna > /dev/null 2>&1
          ikshvaku export cfgtest | grep "idna" > /dev/null || { echo "❌ export"; exit 1; }
          ikshvaku run cfgtest python -c "import idna; print('run-ok')" | grep "run-ok" > /dev/null || { echo "❌ run"; exit 1; }
          ikshvaku clone cfgtest clonetest > /dev/null 2>&1
          ikshvaku run clonetest python -c "import idna" > /dev/null 2>&1 || { echo "❌ clone"; exit 1; }
          ikshvaku list --size | grep "clonetest" > /dev/null || { echo "❌ list --size"; exit 1; }
          ikshvaku cleanup --days 0 | grep "Dry run" > /dev/null || { echo "❌ cleanup dry-run"; exit 1; }
          ikshvaku cleanup --days 0 --apply | grep "Deleted" > /dev/null || { echo "❌ cleanup apply"; exit 1; }
          [ ! -d "$HOME/.Python-Env/clonetest" ] || { echo "❌ cleanup did not delete unlinked"; exit 1; }
          [ -d "$HOME/.Python-Env/myproj" ] || { echo "❌ cleanup deleted a linked env"; exit 1; }

      - name: Version-pinned install + upgrade
        run: |
          CB="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export HOME=$(mktemp -d)
          curl -LsSf "https://raw.githubusercontent.com/ashish-jha-73/IkshvakuPEM/main/install.sh?cb=$CB" | bash -s -- v1.2.0 > /tmp/pin.log 2>&1 || { cat /tmp/pin.log; exit 1; }
          source "$HOME/.ikshvaku/ikshvaku.sh"
          [ "$(ikshvaku --version)" = "ikshvaku 1.2.0" ] || { echo "❌ pinned install"; exit 1; }
          echo "✅ pinned to 1.2.0"
          curl -LsSf "https://raw.githubusercontent.com/ashish-jha-73/IkshvakuPEM/main/install.sh?cb=$CB" | bash -s -- notaversion > /dev/null 2>&1 && { echo "❌ invalid version accepted"; exit 1; } || echo "✅ invalid version rejected"
          export HOME=$(mktemp -d)
          curl -LsSf "https://raw.githubusercontent.com/ashish-jha-73/IkshvakuPEM/main/install.sh?cb=$CB" | bash > /dev/null 2>&1
          source "$HOME/.ikshvaku/ikshvaku.sh"
          ok=""
          for i in 1 2 3; do
            if ikshvaku upgrade 2>/dev/null | grep "Restart your shell" > /dev/null; then ok=1; break; fi
            sleep 15
          done
          [ -n "$ok" ] || { echo "❌ upgrade failed"; exit 1; }
          echo "✅ upgrade ran"

      - name: Tier 4 (json / help / config / prompt)
        run: |
          source ~/.ikshvaku/ikshvaku.sh
          cd "$RUNNER_TEMP/myproj"
          ikshvaku activate myproj > /dev/null 2>&1 || ikshvaku init myproj > /dev/null 2>&1
          ikshvaku list --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d, list)" || { echo "❌ list --json"; exit 1; }
          ikshvaku status --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'version' in d and 'active' in d" || { echo "❌ status --json"; exit 1; }
          ikshvaku links --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d, list)" || { echo "❌ links --json"; exit 1; }
          ikshvaku help cleanup | grep -q "days" || { echo "❌ help"; exit 1; }
          ikshvaku config cleanup_days 45 > /dev/null
          ikshvaku config cleanup_days --unset > /dev/null
          [ -z "$(ikshvaku config cleanup_days)" ] || { echo "❌ config --unset"; exit 1; }
          [ "$(ikshvaku prompt)" = "(myproj) " ] || { echo "❌ prompt"; exit 1; }
          echo "✅ tier 4 (bash)"

      - name: Fish smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fish
          fish -c '
            source ~/.ikshvaku/ikshvaku.fish
            ikshvaku --version
            or exit 1
            mkdir -p ~/fishproj
            cd ~/fishproj
            ikshvaku init fenv
            or exit 1
            set -q IKSHVAKU_ACTIVE
            or exit 1
            ikshvaku install fenv idna
            or exit 1
            ikshvaku run fenv python -c "import idna"
            or exit 1
            ikshvaku remove fenv
            or exit 1
            echo "✅ fish tier OK"
          '

      - name: Install zsh (Ubuntu runners don't ship it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Smoke test (zsh)
        if: runner.os != 'Windows'
        shell: zsh {0}
        run: |
          autoload -U +X bashcompinit && bashcompinit
          source ~/.ikshvaku/ikshvaku.sh
          source ~/.ikshvaku/completion.sh
          ikshvaku list
          ikshvaku create zshtest
          ikshvaku activate zshtest
          [ -n "$VIRTUAL_ENV" ] || { echo "❌ zsh activation failed"; exit 1; }
          pip --version
          deactivate
          [ -f ~/.ikshvaku/completion.zsh ] && echo "✅ native zsh completion shipped"
          ikshvaku remove zshtest
          ikshvaku auto on > /dev/null
          mkdir -p "$HOME/zproj"
          cd "$HOME/zproj"
          ikshvaku init > /dev/null 2>&1
          [ -n "$VIRTUAL_ENV" ] || { echo "❌ zsh init failed"; exit 1; }
          ikshvaku deactivate
          cd "$HOME"
          cd "$HOME/zproj"   # chpwd hook fires -> auto-activates
          [ -n "$VIRTUAL_ENV" ] || { echo "❌ zsh auto-activation failed"; exit 1; }
          ikshvaku auto off > /dev/null
          ikshvaku remove zproj

  smoke-test-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell parse check
        shell: pwsh
        run: |
          foreach ($f in @('src/ikshvaku.ps1', 'install.ps1', 'src/uninstall.ps1')) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
            Write-Host "${f}: parse OK"
          }

      - name: Install (PowerShell 5.1, downloads uv if missing)
        shell: powershell
        run: ./install.ps1

      - name: Smoke test (PowerShell 5.1)
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          ikshvaku list
          ikshvaku create cienv
          ikshvaku install cienv idna
          ikshvaku activate cienv
          if (-not $env:VIRTUAL_ENV) { throw '❌ activation failed' }
          python --version
          pip --version
          deactivate
          if ($env:VIRTUAL_ENV) { throw '❌ deactivate failed' }
          ikshvaku remove cienv

      - name: Project linking (init / bare activate / auto / doctor)
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          $proj = Join-Path $env:RUNNER_TEMP 'psproj'
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Set-Location $proj
          ikshvaku init | Out-Null
          if ($env:IKSHVAKU_ACTIVE -ne 'psproj') { throw '❌ init failed' }
          ikshvaku deactivate
          Set-Location $proj
          ikshvaku activate
          if ($env:IKSHVAKU_ACTIVE -ne 'psproj') { throw '❌ bare activate failed' }
          ikshvaku auto on | Out-Null
          Set-Location $env:USERPROFILE
          ikshvaku deactivate
          Set-Location $proj
          if ($env:IKSHVAKU_ACTIVE -ne 'psproj') { throw '❌ auto activation failed' }
          ikshvaku auto off | Out-Null
          $d = (ikshvaku doctor | Out-String)
          if ($d -notmatch 'All checks passed') { throw "❌ doctor failed: $d" }
          ikshvaku unlink | Out-Null

      - name: Tier 2 (config / run / export / clone / cleanup)
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          Set-Location (Join-Path $env:RUNNER_TEMP 'psproj')
          ikshvaku link psproj | Out-Null
          ikshvaku config python_default 3.12
          if (((ikshvaku config python_default | Out-String).Trim()) -ne 'python_default=3.12') { throw '❌ config' }
          ikshvaku create cfgtest | Out-Null
          ikshvaku install cfgtest idna | Out-Null
          if (((ikshvaku export cfgtest | Out-String)) -notmatch 'idna') { throw '❌ export' }
          ikshvaku run cfgtest python -c "import idna; print('run-ok')" | Select-String 'run-ok'
          if ($LASTEXITCODE -ne 0) { throw '❌ run' }
          ikshvaku clone cfgtest clonetest | Out-Null
          ikshvaku run clonetest python -c "import idna"
          if ($LASTEXITCODE -ne 0) { throw '❌ clone' }
          if (((ikshvaku list --size | Out-String)) -notmatch 'clonetest') { throw '❌ list --size' }
          ikshvaku cleanup --days 0 | Out-String -Stream | Select-String 'Dry run'
          ikshvaku cleanup --days 0 --apply | Out-String -Stream | Select-String 'Deleted'
          if (Test-Path (Join-Path $env:USERPROFILE '.Python-Env\clonetest')) { throw '❌ cleanup did not delete unlinked' }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.Python-Env\psproj'))) { throw '❌ cleanup deleted linked env' }

      - name: Tier 4 (json / help / config --unset)
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          $j = (ikshvaku list --json | Out-String) | ConvertFrom-Json
          if (-not $j) { throw '❌ list --json' }
          $s = (ikshvaku status --json | Out-String) | ConvertFrom-Json
          if (-not $s.version) { throw '❌ status --json' }
          $h = (ikshvaku help cleanup | Out-String)
          if ($h -notmatch 'days') { throw '❌ help' }
          ikshvaku config cleanup_days 45 | Out-Null
          ikshvaku config cleanup_days --unset | Out-Null
          if (Get-IkshvakuConfig 'cleanup_days') { throw '❌ config --unset' }
          Write-Host '✅ tier 4 (PowerShell)'

      - name: Version-pinned install
        shell: pwsh
        run: |
          $cb = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:IKSHVAKU_VERSION = 'v1.2.0'
          Invoke-RestMethod -Uri "https://raw.githubusercontent.com/ashish-jha-73/IkshvakuPEM/main/install.ps1?cb=$cb" | Invoke-Expression
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          if (((ikshvaku --version | Out-String).Trim()) -ne 'ikshvaku 1.2.0') { throw '❌ pinned install' }
          Write-Host '✅ pinned to 1.2.0'

      - name: Smoke test (PowerShell 7)
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          ikshvaku create cienv7
          ikshvaku install cienv7 six
          ikshvaku activate cienv7
          if (-not $env:VIRTUAL_ENV) { throw '❌ activation failed' }
          deactivate
          ikshvaku remove cienv7

      - name: Project linking (PowerShell 7)
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          $proj = Join-Path $env:RUNNER_TEMP 'psproj7'
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Set-Location $proj
          ikshvaku init | Out-Null
          if ($env:IKSHVAKU_ACTIVE -ne 'psproj7') { throw '❌ init failed' }
          ikshvaku deactivate
          Set-Location $proj
          ikshvaku activate
          if ($env:IKSHVAKU_ACTIVE -ne 'psproj7') { throw '❌ bare activate failed' }
          ikshvaku auto on | Out-Null
          Set-Location $env:USERPROFILE
          ikshvaku deactivate
          Set-Location $proj
          if ($env:IKSHVAKU_ACTIVE -ne 'psproj7') { throw '❌ auto activation failed' }
          ikshvaku auto off | Out-Null
          $d = (ikshvaku doctor | Out-String)
          if ($d -notmatch 'All checks passed') { throw "❌ doctor failed: $d" }
          ikshvaku unlink | Out-Null

      - name: Tier 2 (config / run / export / clone / cleanup)
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          Set-Location (Join-Path $env:RUNNER_TEMP 'psproj')
          ikshvaku link psproj | Out-Null
          ikshvaku config python_default 3.12
          if (((ikshvaku config python_default | Out-String).Trim()) -ne 'python_default=3.12') { throw '❌ config' }
          ikshvaku create cfgtest | Out-Null
          ikshvaku install cfgtest idna | Out-Null
          if (((ikshvaku export cfgtest | Out-String)) -notmatch 'idna') { throw '❌ export' }
          ikshvaku run cfgtest python -c "import idna; print('run-ok')" | Select-String 'run-ok'
          if ($LASTEXITCODE -ne 0) { throw '❌ run' }
          ikshvaku clone cfgtest clonetest | Out-Null
          ikshvaku run clonetest python -c "import idna"
          if ($LASTEXITCODE -ne 0) { throw '❌ clone' }
          if (((ikshvaku list --size | Out-String)) -notmatch 'clonetest') { throw '❌ list --size' }
          ikshvaku cleanup --days 0 | Out-String -Stream | Select-String 'Dry run'
          ikshvaku cleanup --days 0 --apply | Out-String -Stream | Select-String 'Deleted'
          if (Test-Path (Join-Path $env:USERPROFILE '.Python-Env\clonetest')) { throw '❌ cleanup did not delete unlinked' }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.Python-Env\psproj'))) { throw '❌ cleanup deleted linked env' }

      - name: Tier 4 (json / help / config --unset)
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          $j = (ikshvaku list --json | Out-String) | ConvertFrom-Json
          if (-not $j) { throw '❌ list --json' }
          $s = (ikshvaku status --json | Out-String) | ConvertFrom-Json
          if (-not $s.version) { throw '❌ status --json' }
          $h = (ikshvaku help cleanup | Out-String)
          if ($h -notmatch 'days') { throw '❌ help' }
          ikshvaku config cleanup_days 45 | Out-Null
          ikshvaku config cleanup_days --unset | Out-Null
          if (Get-IkshvakuConfig 'cleanup_days') { throw '❌ config --unset' }
          Write-Host '✅ tier 4 (PowerShell)'

      - name: Version-pinned install
        shell: pwsh
        run: |
          $cb = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:IKSHVAKU_VERSION = 'v1.2.0'
          Invoke-RestMethod -Uri "https://raw.githubusercontent.com/ashish-jha-73/IkshvakuPEM/main/install.ps1?cb=$cb" | Invoke-Expression
          . "$env:USERPROFILE\.ikshvaku\ikshvaku.ps1"
          if (((ikshvaku --version | Out-String).Trim()) -ne 'ikshvaku 1.2.0') { throw '❌ pinned install' }
          Write-Host '✅ pinned to 1.2.0'

      - name: Smoke test (cmd shim)
        shell: cmd
        run: |
          set PATH=%USERPROFILE%\.local\bin;%PATH%
          mkdir %RUNNER_TEMP%\cmdproj
          cd /d %RUNNER_TEMP%\cmdproj
          ikshvaku init
          if not exist "%USERPROFILE%\.Python-Env\cmdproj" exit /b 1
          ikshvaku activate
          if not defined VIRTUAL_ENV exit /b 1
          python --version
          ikshvaku deactivate
          if defined VIRTUAL_ENV exit /b 1
          ikshvaku activate
          if not defined VIRTUAL_ENV exit /b 1
          ikshvaku remove cmdproj
