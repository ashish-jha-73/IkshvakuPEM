name: 'Setup Ikshvaku environment'
description: 'Install Ikshvaku and create a Python environment available to later steps'
branding:
  icon: 'box'
  color: 'blue'
inputs:
  environment:
    description: 'Environment name (default: the repository name)'
    required: false
  python-version:
    description: 'Python version to pin, e.g. 3.12 (default: system Python)'
    required: false
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        IK_ENVIRONMENT: ${{ inputs.environment }}
        IK_PYTHON: ${{ inputs.python-version }}
      run: |
        curl -LsSf https://raw.githubusercontent.com/ashish-jha-73/IkshvakuPEM/main/install.sh | bash
        source "$HOME/.ikshvaku/ikshvaku.sh"
        env_name="${IK_ENVIRONMENT:-$(basename "$GITHUB_REPOSITORY")}"
        cd "$GITHUB_WORKSPACE"
        ikshvaku init "$env_name" $IK_PYTHON || exit 1
        # expose the environment's python to all later steps
        if [ -n "$VIRTUAL_ENV" ]; then
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          echo "Ikshvaku environment '$env_name' ready: $VIRTUAL_ENV"
        fi
